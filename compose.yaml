name: argilla

x-environment: &environment
  ARGILLA_HOME_PATH: /var/lib/argilla
  ARGILLA_DATABASE_URL: postgresql+asyncpg://argilla:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/argilla
  ARGILLA_ELASTICSEARCH: http://elasticsearch:9200
  ARGILLA_REDIS_URL: redis://redis:6379/0
  HF_TOKEN: ${HF_TOKEN:-}
  ARGILLA_CSGHUB_ENDPOINT: ${ARGILLA_CSGHUB_ENDPOINT:-}
  ARGILLA_CSGHUB_INTERNAL_ENDPOINT: ${ARGILLA_CSGHUB_INTERNAL_ENDPOINT:-}
  ARGILLA_CSGHUB_TOKEN: ${ARGILLA_CSGHUB_TOKEN:-}
  HF_HUB_DISABLE_TELEMETRY: "1"

services:
  init:
    image: ${ARGILLA_IMAGE:-argilla-local:develop}
    user: root
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -d -o 1000 -g 1000 /data/app /data/elasticsearch
        install -d -o 999 -g 999 /data/postgres /data/redis
    volumes:
      - ${ARGILLA_DATA_DIR:-./data}:/data
    restart: "no"

  server:
    image: ${ARGILLA_IMAGE:-argilla-local:develop}
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["${ARGILLA_BIND_ADDRESS:-0.0.0.0}:${ARGILLA_PORT:-6900}:6900"]
    environment:
      <<: *environment
      USERNAME: ${ARGILLA_USERNAME:-root}
      PASSWORD: ${ARGILLA_PASSWORD:?Set ARGILLA_PASSWORD}
      API_KEY: ${ARGILLA_API_KEY:?Set ARGILLA_API_KEY}
      WORKSPACE: ${ARGILLA_WORKSPACE:-admin}
    volumes:
      - ${ARGILLA_DATA_DIR:-./data}/app:/var/lib/argilla
    depends_on:
      init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6900/api/v1/version')"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  worker:
    image: ${ARGILLA_IMAGE:-argilla-local:develop}
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment: *environment
    command: ["python", "-m", "argilla_server", "worker", "--num-workers", "${BACKGROUND_NUM_WORKERS:-2}"]
    volumes:
      - ${ARGILLA_DATA_DIR:-./data}/app:/var/lib/argilla
    depends_on:
      server: {condition: service_healthy}

  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: argilla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: argilla
    volumes:
      - ${ARGILLA_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argilla -d argilla"]
      interval: 5s
      timeout: 3s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    restart: unless-stopped
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      discovery.type: single-node
      xpack.security.enabled: "false"
      node.store.allow_mmap: "false"
    volumes:
      - ${ARGILLA_DATA_DIR:-./data}/elasticsearch:/usr/share/elasticsearch/data
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${ARGILLA_DATA_DIR:-./data}/redis:/data
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
